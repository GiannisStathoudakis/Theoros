apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "theoros.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "theoros.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "theoros.fullname" . }}-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: {{ include "theoros.fullname" . }}
  namespace: {{ .Release.Namespace }}