{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "theoros.fullname" . }}-binding
  labels:
    {{- include "theoros.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "theoros.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
{{- end }}