apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "theoros.fullname" . }}
  labels:
    {{- include "theoros.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "theoros.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "theoros.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "theoros.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}

          volumeMounts:
            - name: jwt-secret-volume
              mountPath: "/etc/theoros/secrets"
              readOnly: true
              
          ports:
            - name: grpc
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
              
      volumes:
        - name: jwt-secret-volume
          secret:
            secretName: theoros-jwt-secret