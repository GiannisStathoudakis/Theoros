replicaCount: 1

image:
  repository: ghcr.io/giannisstathoudakis/theoros-server
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

bootstrap:
  username: "admin"
  password: "super_secure_bootstrap_password" 