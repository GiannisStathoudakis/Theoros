name: Build and Push Theoros

on:
  push:
    branches:
      - master
    paths:
      - 'cmd/server/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    #  security-events: write # for Semgrep and Trivy

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      #  with:
      #    fetch-depth: 0 # for GitLeaks

      # -------------------------------------------------------------
      # PRE-BUILD SCANS
      # -------------------------------------------------------------
      #- name: GitLeaks - Secret Scanner
      #  uses: gitleaks/gitleaks-action@v3
      #  env:
      #    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      #- name: Semgrep - SAST Scanner
      #  run: |
      #    python3 -m pip install semgrep
      #    semgrep scan --config auto --sarif --output=semgrep.sarif ./

      #- name: Upload Semgrep SARIF
      #  if: always()
      #  uses: github/codeql-action/upload-sarif@v4
      #  with:
      #    sarif_file: semgrep.sarif

      # -------------------------------------------------------------
      # BUILD STAGE (Go Native)
      # -------------------------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Verify Go Build (CI Check)
        run: |
          # We build the binary here just to ensure it compiles successfully 
          # before wasting time spinning up Docker.
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o theoros-server ./cmd/server/main.go

      # -------------------------------------------------------------
      # DOCKER STAGE
      # -------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false 
          tags: ghcr.io/giannisstathoudakis/theoros-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------------------------------------------
      # POST-BUILD SCANS & PUSH
      # -------------------------------------------------------------
      #- name: Trivy Scanner
      #  uses: aquasecurity/trivy-action@v0.36.0
      #  with:
      #    image-ref: ghcr.io/giannisstathoudakis/theoros-server:${{ github.sha }}
      #    format: 'sarif'
      #    output: 'trivy-results.sarif'
      #    exit-code: '0' 
      #    ignore-unfixed: true
      #    vuln-type: 'os,library'
      #    severity: 'CRITICAL,HIGH'

      #- name: Upload Trivy SARIF
      #  if: always()
      #  uses: github/codeql-action/upload-sarif@v4
      #  with:
      #    sarif_file: trivy-results.sarif

      - name: Push Docker Image to GHCR
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          sbom: true
          provenance: true
          tags: ghcr.io/giannisstathoudakis/theoros-server:${{ github.sha }},ghcr.io/giannisstathoudakis/theoros-server:latest
          cache-from: type=gha