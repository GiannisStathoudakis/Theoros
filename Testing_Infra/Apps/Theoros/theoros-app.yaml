apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: theoros
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/GiannisStathoudakis/Theoros.git'
    targetRevision: master 
    path: chart 
    
  destination:
    server: https://kubernetes.default.svc
    namespace: theoros
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true