apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: theoros
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'ghcr.io/giannisstathoudakis'
    chart: theoros-helm
    targetRevision: 1.0.0
  destination:
    server: https://kubernetes.default.svc
    namespace: theoros
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true