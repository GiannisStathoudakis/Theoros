apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io/
    chart: cilium
    targetRevision: 1.19.5
    helm:
      values: |
        kubeProxyReplacement: "true"
        localRedirectPolicy: true
        k8sServiceHost: "192.168.200.30"
        k8sServicePort: 6443
        hostFirewall:
          enabled: true
        
        l7Proxy: false
        envoy:
          enabled: false

        l2announcements:
          enabled: true
        k8sClientRateLimit:
          qps: 50
          burst: 100
        externalIPs:
          enabled: true

        hubble:
          enabled: true
          relay:
            enabled: true
          ui:
            enabled: true
            
        localRedirectPolicies:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true