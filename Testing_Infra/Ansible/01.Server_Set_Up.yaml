---
- hosts: master
  become: true

  vars:
    admin_user: "{{ ansible_user }}"

  tasks:
    - name: 01. Install updates for Ubuntu
      tags: always
      ansible.builtin.apt:
        upgrade: dist
        update_cache: yes
        autoremove: yes

    - name: 02. Disable UFW Firewall
      ansible.builtin.systemd:
        name: ufw
        state: stopped
        enabled: false

    - name: 03. Disable swap
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: 04. Disable swap permanently
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#\n]*?\sswap\s+.*)$'
        replace: '# \1'

    - name: 05. Load containerd storage module (overlay) on boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
        mode: '0644'

    - name: 06. Load overlay module immediately
      ansible.builtin.command: modprobe overlay
      changed_when: false

    - name: 07. Enable IP forwarding for pod routing
      ansible.builtin.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: true
        state: present
        reload: true

    - name: 08. Create K3s directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'

    - name: 09. Write K3s master configuration file (Cilium Prep)
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        content: |
          write-kubeconfig-mode: "0644"
          flannel-backend: "none"
          disable-network-policy: true
          disable-kube-proxy: true
          disable:
            - traefik
            - servicelb
        mode: '0600'

    - name: 10. Download and execute K3s installer
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: 11. Enable and start K3s service
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true

    - name: 12. Create .kube directory for admin user
      ansible.builtin.file:
        path: "/home/{{ admin_user }}/.kube"
        state: directory
        mode: '0755'
        owner: "{{ admin_user }}"

    - name: 13. Copy cluster kubeconfig to local user
      ansible.builtin.copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "/home/{{ admin_user }}/.kube/config"
        remote_src: true
        mode: '0600'
        owner: "{{ admin_user }}"

    - name: 14. Install Latest Helm
      ansible.builtin.shell: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: 15. Disable Root SSH Login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
      notify: Restart SSH

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted